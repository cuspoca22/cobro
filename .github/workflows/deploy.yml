name: Deploy a Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar build de produccion
        run: npm run build:prod

      - name: Subir archivos al servidor via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "dist/,package.json,ecosystem.config.cjs,public/"
          target: "~/proyectos/api"
          strip_components: 0

      - name: Ejecutar deploy en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd ~/proyectos/api
            npm install --production
            # Arranca/recarga siempre desde dist (no src / ts-node)
            pm2 delete cobro || true
            pm2 start ecosystem.config.cjs
            pm2 save
